blueprint:
  name: Unser Zuhause – Kamera-Modus
  author: SebastianInTheWild
  description: >
    Stellt Kameras bzw. Alarmanlagen passend zum Hausmodus und zur Uhrzeit um: Hausmodus „abwesend“ →
    Abwesend-Modus, sonst tagsüber Zuhause-Modus und abends Nacht-Modus. Läuft zu Tages- und Nachtbeginn
    und bei jedem Wechsel des Hausmodus.


    Optional kommt eine Push-Nachricht mit dem neuen Modus – nur, wenn sich wirklich etwas geändert hat.
    Funktioniert mit jeder Alarm-Zentrale (`alarm_control_panel`), z. B. Eufy, Alarmo oder Ring.
    Für die Nachricht wird die Integration „Unser Zuhause“ (Versand an Personen) benötigt.
  source_url: https://github.com/SebastianInTheWild/ha-unser-zuhause-blueprints/blob/main/blueprints/automation/unser_zuhause/kamera_modus.yaml
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    zentralen:
      name: Kameras & Zeiten
      icon: mdi:cctv
      input:
        alarm_panels:
          name: Alarm-Zentralen
          description: Alle Zentralen, die umgestellt werden (bei Eufy die Entität „Security mode“).
          selector:
            entity:
              filter:
                - domain: alarm_control_panel
              multiple: true
        house_mode:
          name: Hausmodus
          default: select.unser_zuhause_hausmodus
          selector:
            entity:
              filter:
                - domain:
                    - select
                    - input_select
        away_state:
          name: Zustand „abwesend“
          description: Wert des Hausmodus für den Abwesend-Modus. Jeder andere Wert gilt als zuhause.
          default: abwesend
          selector:
            text: {}
        day_start:
          name: Zuhause-Modus ab
          default: "07:00:00"
          selector:
            time: {}
        night_start:
          name: Nacht-Modus ab
          default: "21:00:00"
          selector:
            time: {}
    nachricht:
      name: Benachrichtigung
      icon: mdi:bell
      collapsed: true
      input:
        notify_persons:
          name: Personen
          description: >-
            Wer eine Nachricht bekommt, wenn sich ein Modus geändert hat. Leer lassen für keine Nachricht.
            Die Handys werden über den in der Home-Assistant-App angemeldeten Benutzer gefunden
            (Integration „Unser Zuhause“).
          default: []
          selector:
            entity:
              filter:
                - domain: person
              multiple: true
        status_delay:
          name: Status prüfen nach
          description: Cloud-Kameras wie Eufy melden den neuen Modus erst nach einigen Sekunden.
          default:
            seconds: 30
          selector:
            duration: {}

# Mehrere Auslöser kurz hintereinander nacheinander abarbeiten, damit sich die Läufe nicht gegenseitig
# die Nachricht wegnehmen.
mode: queued
max: 5

variables:
  alarm_panels: !input alarm_panels
  notify_persons: !input notify_persons

triggers:
  - trigger: time
    at: !input day_start
  - trigger: time
    at: !input night_start
  - trigger: state
    entity_id: !input house_mode
    to: ~

actions:
  - variables:
      modus_vorher: "{{ alarm_panels | map('states') | list }}"
  - choose:
      - alias: Abwesend
        conditions:
          - condition: state
            entity_id: !input house_mode
            state: !input away_state
        sequence:
          - action: alarm_control_panel.alarm_arm_away
            target:
              entity_id: "{{ alarm_panels }}"
      - alias: Zuhause
        conditions:
          - condition: time
            after: !input day_start
            before: !input night_start
        sequence:
          - action: alarm_control_panel.alarm_arm_home
            target:
              entity_id: "{{ alarm_panels }}"
    default:
      - alias: Nacht
        action: alarm_control_panel.alarm_arm_night
        target:
          entity_id: "{{ alarm_panels }}"
  - alias: Benachrichtigung nur bei geändertem Modus
    if:
      - condition: template
        value_template: "{{ notify_persons | count > 0 }}"
    then:
      - delay: !input status_delay
      - condition: template
        value_template: "{{ alarm_panels | map('states') | list != modus_vorher }}"
      - action: unser_zuhause.notify
        data:
          persons: "{{ notify_persons }}"
          title: 📷 Kameras
          message: >-
            {% set namen = {'armed_away': '🚶 Abwesend', 'armed_home': '🏠 Zuhause', 'armed_night': '😴 Nacht',
                            'armed_vacation': '🧳 Urlaub', 'disarmed': '🔓 Aus'} %}
            {%- for e in alarm_panels %}
            {%- set geraet = device_id(e) %}
            {%- set name = (device_attr(geraet, 'name_by_user') or device_attr(geraet, 'name')) if geraet
                           else state_attr(e, 'friendly_name') %}
            {{- name }}: {{ namen.get(states(e), states(e)) }}{{ '\n' if not loop.last }}
            {%- endfor %}
          data:
            group: kameras
            tag: uz-kamera-modus
