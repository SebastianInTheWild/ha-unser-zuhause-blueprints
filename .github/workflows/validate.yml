name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  blueprints:
    name: Blueprints prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: YAML lesbar, Pflichtfelder vorhanden
        run: |
          python - <<'EOF'
          import pathlib, sys, yaml

          class Loader(yaml.SafeLoader):
              pass

          Loader.add_constructor("!input", lambda loader, node: {"__input__": loader.construct_scalar(node)})
          ok = True
          for path in sorted(pathlib.Path("blueprints").rglob("*.yaml")):
              data = yaml.load(path.read_text(encoding="utf-8"), Loader=Loader)
              bp = data.get("blueprint", {})
              inputs = set()
              # Abschnitte (sections) enthalten ihre Eingaben unter `input`
              for key, value in bp.get("input", {}).items():
                  inputs |= set(value["input"]) if "input" in (value or {}) else {key}
              used = set()

              def walk(x):
                  if isinstance(x, dict):
                      if "__input__" in x:
                          used.add(x["__input__"])
                      for v in x.values():
                          walk(v)
                  elif isinstance(x, list):
                      for v in x:
                          walk(v)

              walk({k: v for k, v in data.items() if k != "blueprint"})
              missing = [k for k in ("name", "domain", "input", "source_url") if k not in bp]
              unknown = used - inputs
              if missing or unknown or "triggers" not in data or "actions" not in data:
                  ok = False
                  print(f"✗ {path}: fehlt {missing}, unbekannte Eingaben {sorted(unknown)}")
              else:
                  print(f"✓ {path}: {bp['name']} ({len(inputs)} Eingaben)")
          sys.exit(0 if ok else 1)
          EOF

  homeassistant:
    name: In Home Assistant laden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: Test-Konfiguration bauen (eine Automation pro Blueprint)
        run: python .github/scripts/blueprint_testconfig.py blueprints ci-config
      - name: Konfiguration prüfen (Home Assistant stable)
        run: |
          set -o pipefail
          image=ghcr.io/home-assistant/home-assistant:stable
          docker pull -q "$image"
          docker run --rm --entrypoint python "$image" -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
          # check_config endet auch bei abgelehnten Automationen mit 0 – die Fehler stehen nur im Log.
          docker run --rm --entrypoint python -v "$PWD/ci-config:/config" "$image" \
            -m homeassistant --script check_config -c /config 2>&1 | tee check.log
          if sed 's/\x1b\[[0-9;]*m//g' check.log | grep -qwE "ERROR|CRITICAL"; then
            echo "::error::Home Assistant hat mindestens einen Blueprint abgelehnt (Details oben)."
            exit 1
          fi
